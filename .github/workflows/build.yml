name: Build APK

# 릴리스할 때만 빌드: VERSION 파일의 버전을 올려서 push하면 그 버전으로 릴리스
on:
  push:
    branches: [ main ]
    paths: [ 'VERSION' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Version
        run: echo "APP_VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Signing key (Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$S_STORE_PW"
              echo "KEY_ALIAS=$S_ALIAS"
              echo "KEY_PASSWORD=$S_KEY_PW"
            } >> "$GITHUB_ENV"
          elif [ -f app/cardsummary.jks ]; then
            echo "Secrets 없음: 임시로 저장소 안 키 사용"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/cardsummary.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=cardsummary" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=cardsummary" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=cardsummary" >> "$GITHUB_ENV"
          else
            echo "서명 키 Secrets가 없습니다"; exit 1
          fi

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 카드 정리 v${{ env.APP_VERSION }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
